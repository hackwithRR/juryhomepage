  <!-- ================= JUYSDOT STUDIO METRICS ================= -->
  <style>
    :root {
      /* Jurysoft palette — matches the hero background exactly */
      --navy: #0B0F17;
      --navy-light: #141A26;
      --blue: #1646A0;
      --orange: #FF5500;
      --white: #FFFFFF;

      --glass: rgba(255,255,255,0.055);
      --glass-hover: rgba(255,255,255,0.085);
      --line: rgba(255,255,255,0.14);
      --muted: rgba(255,255,255,0.65);
    }

    .juysdot-proof {
      position: relative;
      isolation: isolate;
      width: 100%;
      overflow: hidden;
      padding-bottom: clamp(40px, 5vw, 72px);
      /* Base colour is identical to the hero background (#0B0F17) so the
         seam between the two sections is invisible. */
      background:
        radial-gradient(
          ellipse at 48% -120%,
          rgba(22,70,160,0.18),
          transparent 68%
        ),
        var(--navy);
    }

    .jd-orb {
      position: absolute;
      z-index: -1;
      pointer-events: none;
      border-radius: 50%;
      filter: blur(75px);
    }

    .jd-orb-blue {
      width: 280px;
      height: 280px;
      top: -220px;
      left: 23%;
      background: var(--blue);
      opacity: 0.14;
    }

    .jd-orb-orange {
      width: 170px;
      height: 170px;
      right: -140px;
      top: 15%;
      background: var(--orange);
      opacity: 0.06;
    }

    .jd-inner {
      width: 100%;
      max-width: 1280px; /* matches the hero's max-w-7xl container */
      margin: 0 auto;
      padding: 38px 24px 0; /* matches the hero's px-6 gutter */
    }

    .jd-stats {
      position: relative;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      width: 100%;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 15px;
      background: rgba(255,255,255,0.045);
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      box-shadow:
        0 18px 55px rgba(0,0,0,0.13),
        inset 0 1px 0 rgba(255,255,255,0.055);
    }

    .jd-stats::before {
      content: "";
      position: absolute;
      top: 0;
      left: -23%;
      width: 23%;
      height: 2px;
      z-index: 3;
      pointer-events: none;
      background: linear-gradient(90deg, transparent, var(--orange), var(--orange));
      animation: jd-edge 7s ease-in-out infinite;
    }

    @keyframes jd-edge {
      0% { left: -23%; }
      75%, 100% { left: 100%; }
    }

    .jd-stat {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      min-height: 168px;
      padding: 24px 20px 23px;
      transition: background 250ms ease;
    }

    .jd-stat + .jd-stat {
      border-left: 1px solid var(--line);
    }

    .jd-stat:hover {
      background: var(--glass-hover);
    }

    .jd-stat::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 20px;
      width: 23px;
      height: 2px;
      background: var(--orange);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 250ms ease;
    }

    .jd-stat:hover::after {
      transform: scaleX(1);
    }

    .jd-stat-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 7px;
      margin-bottom: 23px;
    }

    .jd-index {
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.2px;
      white-space: nowrap;
    }

    .jd-symbol {
      display: grid;
      place-items: center;
      width: 27px;
      height: 27px;
      flex-shrink: 0;
      color: var(--orange);
      border: 1px solid rgba(255,101,8,0.27);
      border-radius: 8px;
      background: rgba(255,101,8,0.075);
    }

    .jd-symbol svg {
      width: 14px;
      height: 14px;
    }

    .jd-number {
      display: flex;
      align-items: baseline;
      gap: 1px;
      color: var(--white);
      font-size: clamp(32px, 2.65vw, 44px);
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1.08;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .jd-number .suffix {
      color: var(--orange);
      font-size: 0.85em;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .jd-label {
      margin-top: 11px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      line-height: 1.65;
      letter-spacing: 0.85px;
      text-transform: uppercase;
    }

    .jd-ticker {
      position: relative;
      width: 100%;
      margin-top: 20px;
      overflow: hidden;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.025);
    }

    .jd-ticker::before,
    .jd-ticker::after {
      content: "";
      position: absolute;
      z-index: 2;
      top: 0;
      bottom: 0;
      width: 40px;
      pointer-events: none;
    }

    .jd-ticker::before {
      left: 0;
      background: linear-gradient(90deg, var(--navy), transparent);
    }

    .jd-ticker::after {
      right: 0;
      background: linear-gradient(270deg, var(--navy), transparent);
    }

    .jd-ticker-track {
      display: flex;
      width: max-content;
      animation: jd-scroll 38s linear infinite;
      will-change: transform;
    }

    .jd-ticker-group {
      display: flex;
      flex-shrink: 0;
      align-items: center;
    }

    .jd-ticker-item {
      display: flex;
      align-items: center;
      gap: 23px;
      padding: 19px 24px;
      color: rgba(255,255,255,0.78);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.15px;
      white-space: nowrap;
    }

    .jd-diamond {
      width: 6px;
      height: 6px;
      flex-shrink: 0;
      background: var(--orange);
      transform: rotate(45deg);
    }

    @keyframes jd-scroll {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    @media (hover: hover) {
      .jd-ticker:hover .jd-ticker-track {
        animation-play-state: paused;
      }
    }

    @media (min-width: 1051px) and (max-width: 1450px) {
      .jd-inner {
        padding-right: 24px;
        padding-left: 24px;
      }
      .jd-stat {
        padding-right: 14px;
        padding-left: 14px;
        min-height: 158px;
      }
      .jd-stat::after {
        left: 14px;
      }
      .jd-number {
        font-size: clamp(30px, 2.7vw, 39px);
      }
      .jd-index {
        font-size: 8px;
        letter-spacing: 0.8px;
      }
      .jd-label {
        font-size: 9px;
        letter-spacing: 0.55px;
      }
    }

    @media (max-width: 1050px) {
      .jd-inner {
        padding: 30px 24px 0;
      }
      .jd-stats {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .jd-stat {
        min-height: 150px;
        padding: 20px 22px;
      }
      .jd-stat:nth-child(4) {
        border-left: none;
      }
      .jd-stat:nth-child(n + 4) {
        border-top: 1px solid var(--line);
      }
      .jd-number {
        font-size: clamp(34px, 4.8vw, 46px);
      }
      .jd-stat-top {
        margin-bottom: 19px;
      }
    }

    @media (max-width: 560px) {
      .jd-inner {
        padding: 22px 24px 0;
      }
      .jd-stats {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        border-radius: 12px;
      }
      .jd-stat {
        min-height: 136px;
        padding: 16px 13px;
      }
      .jd-stat:nth-child(3),
      .jd-stat:nth-child(5) {
        border-left: none;
      }
      .jd-stat:nth-child(4) {
        border-left: 1px solid var(--line);
      }
      .jd-stat:nth-child(n + 3) {
        border-top: 1px solid var(--line);
      }
      .jd-stat::after {
        left: 13px;
      }
      .jd-stat-top {
        margin-bottom: 19px;
      }
      .jd-index {
        font-size: 8px;
        letter-spacing: 0.5px;
      }
      .jd-symbol {
        width: 25px;
        height: 25px;
      }
      .jd-number {
        font-size: clamp(31px, 8.5vw, 39px);
        letter-spacing: -1.5px;
      }
      .jd-label {
        margin-top: 8px;
        font-size: 9px;
        letter-spacing: 0.35px;
      }
      .jd-ticker {
        margin-top: 14px;
      }
      .jd-ticker-item {
        gap: 17px;
        padding: 17px 18px;
        font-size: 10px;
      }
      .jd-ticker-track {
        animation-duration: 42s;
      }
      .jd-ticker::before,
      .jd-ticker::after {
        width: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }
      .jd-stats::before,
      .jd-ticker-track {
        animation: none;
      }
      .jd-stat,
      .jd-stat::after {
        transition: none;
      }
    }


  <style>
    /* ---------- Section shell ---------- */
    #capabilities {
      --cap-canvas: #05070A;
      --cap-dark: #090D14;
      --cap-card: #0E131F;
      --cap-line: #1A2336;
      --cap-line-hi: #2A3854;
      position: relative;
      isolation: isolate;
      width: 100%;
      overflow: hidden;
      padding: clamp(44px, 6vw, 88px) 0 clamp(56px, 8vw, 120px);
      color: #E2E8F0;
      background:
        radial-gradient(ellipse at 50% -10%, rgba(255, 69, 0, 0.10), transparent 62%),
        linear-gradient(180deg, var(--navy) 0%, #070A11 42%, var(--cap-canvas) 100%);
    }

    #capabilities .cap-inner {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1280px; /* matches hero + juysdot containers */
      margin: 0 auto;
      padding: 0 24px;
    }

    /* ---------- Scoped matrix backdrop ---------- */
    #capabilities .cap-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    #capabilities .cap-bg canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.22;
    }

    #capabilities .cap-bg-fade {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, var(--navy) 0%, rgba(5, 7, 10, 0.35) 45%, var(--cap-canvas) 100%);
    }

    #capabilities .cap-scanlines {
      position: absolute;
      inset: 0;
      opacity: 0.16;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0),
        rgba(255, 255, 255, 0) 50%,
        rgba(0, 0, 0, 0.4) 50%,
        rgba(0, 0, 0, 0.4)
      );
      background-size: 100% 4px;
    }

    /* ---------- Glass panels ---------- */
    #capabilities .cap-panel {
      background: rgba(14, 19, 31, 0.82);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border: 1px solid var(--cap-line);
    }

    #capabilities .cap-panel-soft {
      background: rgba(9, 13, 20, 0.78);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border: 1px solid var(--cap-line);
    }

    /* ---------- Panel swap transition ---------- */
    #capabilities .cap-panel-swap {
      transition:
        opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1),
        transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #capabilities .cap-panel-hidden {
      opacity: 0;
      transform: translateY(8px);
    }

    #capabilities .cap-panel-visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ---------- Blade (tab) cards ---------- */
    #capabilities .cap-blade {
      position: relative;
      overflow: hidden;
      text-align: left;
      transition: opacity 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
    }

    #capabilities .cap-blade:hover {
      transform: translateY(-2px);
    }

    #capabilities .cap-blade-line {
      transition: opacity 0.3s ease;
    }

    /* ---------- Internal scrollbars (scoped to this section) ---------- */
    #capabilities .cap-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
    #capabilities .cap-scroll::-webkit-scrollbar-track { background: var(--cap-canvas); }
    #capabilities .cap-scroll::-webkit-scrollbar-thumb { background: var(--cap-line); border-radius: 2px; }
    #capabilities .cap-scroll::-webkit-scrollbar-thumb:hover { background: #FF4500; }

    /* ---------- Toast (lives outside the section, so styles are unscoped) ---------- */
    #cap-toast {
      background: rgba(14, 19, 31, 0.92);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 69, 0, 0.5);
    }

    /* ---------- Motion safety ---------- */
    @media (prefers-reduced-motion: reduce) {
      #capabilities .cap-panel-swap,
      #capabilities .cap-blade,
      #capabilities .cap-blade-line {
        transition: none !important;
      }
      #capabilities .cap-bg canvas { opacity: 0.08; }
    }
  </style>
  <!-- ================= WHO WE ARE : SCROLLYTELLING MESH ================= -->
  <style>
    /* ---------- Section shell ---------- */
    #who-we-are {
      --ww-navy: #0B0F17;
      --ww-blue: #1646A0;
      --ww-orange: #FF5500;
      --ww-line: rgba(255, 255, 255, 0.12);
      --ww-line-hi: rgba(255, 85, 0, 0.55);
      --ww-glass: rgba(14, 19, 31, 0.82);
      position: relative;
      isolation: isolate;
      width: 100%;
      /* `clip` (not `hidden`) — `hidden` would make this element a scroll
         container, which breaks the `position: sticky` map panel. */
      overflow: clip;
      padding: clamp(56px, 7vw, 104px) 0 clamp(64px, 8vw, 128px);
      color: #E2E8F0;
      background:
        radial-gradient(ellipse at 74% -12%, rgba(22, 70, 160, 0.30), transparent 62%),
        radial-gradient(ellipse at 14% 108%, rgba(255, 85, 0, 0.10), transparent 58%),
        var(--ww-navy);
    }

    #who-we-are .ww-inner {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 1280px; /* matches hero + juysdot containers */
      margin: 0 auto;
      padding: 0 24px;
    }

    #who-we-are .ww-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 32px;
      align-items: start;
    }

    @media (min-width: 1024px) {
      #who-we-are .ww-grid {
        grid-template-columns: 1fr 1fr;
        gap: 40px;
      }
    }

    /* ---------- Glass panels ---------- */
    #who-we-are .ww-panel {
      position: relative;
      background: var(--ww-glass);
      -webkit-backdrop-filter: blur(16px);
      backdrop-filter: blur(16px);
      border: 1px solid var(--ww-line);
      box-shadow: 0 18px 48px -18px rgba(0, 0, 0, 0.85);
    }

    #who-we-are .ww-panel-soft {
      background: rgba(9, 13, 20, 0.78);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border: 1px solid var(--ww-line);
    }

    /* ---------- Tactical reticles (orange) ---------- */
    #who-we-are .ww-reticle {
      position: absolute;
      width: 8px;
      height: 8px;
      pointer-events: none;
    }
    /* NOTE: the colour must live inside the shorthand — `border-top: 2px solid`
       resets border-top-color to currentColor and would override a
       separate `border-color` declaration. */
    #who-we-are .ww-reticle.tl { top: -1px; left: -1px; border-top: 2px solid var(--ww-orange); border-left: 2px solid var(--ww-orange); }
    #who-we-are .ww-reticle.tr { top: -1px; right: -1px; border-top: 2px solid var(--ww-orange); border-right: 2px solid var(--ww-orange); }
    #who-we-are .ww-reticle.bl { bottom: -1px; left: -1px; border-bottom: 2px solid var(--ww-orange); border-left: 2px solid var(--ww-orange); }
    #who-we-are .ww-reticle.br { bottom: -1px; right: -1px; border-bottom: 2px solid var(--ww-orange); border-right: 2px solid var(--ww-orange); }

    /* ---------- Chapter cards ---------- */
    #who-we-are .ww-card {
      opacity: 0.28;
      transform: scale(0.96);
      filter: blur(3px);
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 0.5s cubic-bezier(0.16, 1, 0.3, 1),
                  border-color 0.5s ease,
                  box-shadow 0.5s ease;
    }

    #who-we-are .ww-card.is-active {
      opacity: 1;
      transform: scale(1);
      filter: blur(0);
      border-color: var(--ww-line-hi);
      box-shadow: 0 20px 56px -18px rgba(255, 85, 0, 0.28), inset 0 0 24px rgba(22, 70, 160, 0.10);
    }

    /* ---------- Hub buttons ---------- */
    #who-we-are .ww-hub-btn {
      border: 1px solid var(--ww-line);
      color: #94A3B8;
      transition: border-color 0.3s ease, color 0.3s ease, background-color 0.3s ease;
    }
    #who-we-are .ww-hub-btn:hover {
      background: rgba(22, 70, 160, 0.28);
      color: #FFFFFF;
    }
    #who-we-are .ww-hub-btn.is-active {
      border-color: var(--ww-orange);
      color: #FFFFFF;
      background: rgba(255, 85, 0, 0.12);
    }

    /* ---------- Inline hub links (chapter 04) ---------- */
    #who-we-are .ww-hub-link {
      cursor: pointer;
      background: none;
      border: 0;
      padding: 0;
    }
    #who-we-are .ww-hub-link:focus-visible {
      outline: 2px solid var(--ww-orange);
      outline-offset: 3px;
    }

    /* ---------- Map canvas frame ---------- */
    #who-we-are .ww-map-shell {
      background:
        radial-gradient(ellipse at 50% 40%, rgba(22, 70, 160, 0.22), transparent 70%),
        rgba(5, 7, 10, 0.92);
      border: 1px solid var(--ww-line);
    }

    #who-we-are .ww-scanlines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.22;
      background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0),
        rgba(255, 255, 255, 0) 50%,
        rgba(0, 0, 0, 0.4) 50%,
        rgba(0, 0, 0, 0.4)
      );
      background-size: 100% 4px;
    }

    /* ---------- Scoped scrollbars ---------- */
    #who-we-are .ww-scroll::-webkit-scrollbar { width: 4px; }
    #who-we-are .ww-scroll::-webkit-scrollbar-track { background: #05070A; }
    #who-we-are .ww-scroll::-webkit-scrollbar-thumb { background: #1A2336; border-radius: 2px; }
    #who-we-are .ww-scroll::-webkit-scrollbar-thumb:hover { background: var(--ww-orange); }

    /* ---------- Endcap (scroll runway for the final chapter) ---------- */
    #who-we-are .ww-endcap {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 46vh;
      padding: 24px 0 8px;
    }
    #who-we-are .ww-endcap-label {
      font-family: "JetBrains Mono", ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.32em;

#commit .ruler .base{height:1px;top:auto;bottom:0;background:rgba(139,109,255,.55)}
#commit .ruler .minor{
  height:7px;bottom:1px;
  background:repeating-linear-gradient(90deg,rgba(139,109,255,.55) 0 1px,transparent 1px 10px);
}
#commit .ruler .major{
  height:14px;bottom:1px;
  background:repeating-linear-gradient(90deg,rgba(185,168,255,.95) 0 1.5px,transparent 1.5px 50px);
}

  <script>
    (() => {
      "use strict";

      const root = document.getElementById("why-jurysoft");
      if (!root) return;

      const $ = (sel) => root.querySelector(sel);
      const $$ = (sel) => Array.from(root.querySelectorAll(sel));

      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const stages = [1, 2, 3, 4].map((n) => document.getElementById(`wj-stage-${n}`)).filter(Boolean);
      const conduit = document.getElementById("wj-conduit");
      const laser = document.getElementById("wj-laser");
      const endcap = document.getElementById("wj-endcap");

      /* =========================================================
         SCROLL PROGRESS -> LASER CONDUIT
         ========================================================= */
      /* The fill is driven by the live scroll geometry rather than by the
         IntersectionObserver, so a fast flick can never skip a stage.
         The tip is anchored to the timeline NODES (not the stage boxes), so
         the illuminated head lands exactly on a node as it crosses the
         trigger line - the rail now sits on the node axis. */
      function updateProgress() {
        if (!laser || !conduit || stages.length === 0) return;

        // On mobile the node column is collapsed, so fall back to the stage
        // box centre to keep the fill monotonic.
        const anchors = stages
          .map((s) => s.querySelector(".wj-node"))
          .filter((n) => n && n.offsetParent !== null);
        const boxes = anchors.length === stages.length ? anchors : stages;

        const first = boxes[0].getBoundingClientRect();
        const last = boxes[boxes.length - 1].getBoundingClientRect();

        const startPoint = first.top + first.height / 2;
        const endPoint = last.top + last.height / 2;
        const triggerLine = window.innerHeight * 0.65;

        // Tip Y follows the trigger line, pinned to the first/last node.
        const tipY = Math.min(Math.max(triggerLine, startPoint), endPoint);

        // Convert the viewport Y into a percentage of the rail box.
        const rail = conduit.getBoundingClientRect();
        if (!rail.height) return;
        const pct = ((tipY - rail.top) / rail.height) * 100;

        laser.style.height = `${Math.min(Math.max(pct, 0), 100).toFixed(2)}%`;

        if (endcap) {
          const lit = tipY >= endPoint - 1;
          endcap.style.borderColor = lit ? "#FF4500" : "#1A2336";
          endcap.style.backgroundColor = lit ? "#FF4500" : "#080E1E";
          endcap.style.boxShadow = lit ? "0 0 15px #FF4500" : "none";
        }
      }

      /* =========================================================
         STAGE ACTIVATION
         ========================================================= */
      function activateStage(el) {
        if (!el || el.classList.contains("is-active")) return;
        el.classList.add("is-active");
      }

      function initObserver() {
        if (!("IntersectionObserver" in window)) {
          stages.forEach(activateStage);
          return;
        }

        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) activateStage(entry.target);
          });
        }, {
          root: null,
          rootMargin: "-10% 0px -15% 0px",
          threshold: 0.15,
        });

        stages.forEach((stage) => observer.observe(stage));
      }

      /* =========================================================
         CANVAS ENGINE (device-pixel-ratio aware)
         ========================================================= */
      const ORANGE = "#FF4500";
      const ORANGE_LIGHT = "#FF7338";

      /* Prepares a canvas for crisp rendering at the current DPR.
         Returns { ctx, w, h } in CSS pixels, or null when not laid out yet. */
      function prepare(canvas) {
        if (!canvas || !canvas.parentElement) return null;
        const rect = canvas.parentElement.getBoundingClientRect();
        if (!rect.width || !rect.height) return null;

        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = rect.width;
        const h = rect.height;

        if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
          canvas.width = Math.round(w * dpr);
          canvas.height = Math.round(h * dpr);
        }
        // setTransform (not scale) so repeated resizes never accumulate transforms
        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);

        return { ctx, w, h };
      }

      /* ---------- Stage 01 : target radar lock ---------- */
      function drawStage1(view, t) {
        const { ctx, w, h } = view;
        const cx = w / 2;
        const cy = h / 2;

        ctx.strokeStyle = "rgba(255, 69, 0, 0.2)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(cx, cy, 35, 0, Math.PI * 2);
        ctx.stroke();

        const rot = t * 0.03;
        ctx.strokeStyle = ORANGE;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(cx, cy, 25, rot, rot + Math.PI * 0.8);
        ctx.stroke();

        ctx.fillStyle = ORANGE;
        ctx.beginPath();
        ctx.arc(cx, cy, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      /* ---------- Stage 02 : encrypted direct peer link ---------- */
      function drawStage2(view, t) {
        const { ctx, w, h } = view;

        const p1 = { x: w * 0.2, y: h * 0.5 };
        const p2 = { x: w * 0.8, y: h * 0.5 };

        ctx.strokeStyle = "rgba(255, 69, 0, 0.3)";
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 6]);
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
        ctx.setLineDash([]);

        /* Endpoints */
        ctx.fillStyle = ORANGE;
        [p1, p2].forEach((p) => {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
          ctx.fill();
        });

        /* Encrypted packets travelling peer to peer */
        const packets = 3;
        for (let i = 0; i < packets; i++) {
          const phase = ((t * 0.012) + i / packets) % 1;
          const px = p1.x + (p2.x - p1.x) * phase;
          const py = p1.y + (p2.y - p1.y) * phase;
          const fade = Math.sin(phase * Math.PI);

          ctx.fillStyle = ORANGE_LIGHT;
          ctx.globalAlpha = fade;
          ctx.beginPath();
          ctx.arc(px, py, 3, 0, Math.PI * 2);
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }

      /* ---------- Stage 03 : outcomes ROI telemetry curve ---------- */
      function drawStage3(view, t) {
        const { ctx, w, h } = view;

        ctx.strokeStyle = ORANGE;
        ctx.lineWidth = 2;
        ctx.beginPath();

        const points = 8;
        const slice = w / (points - 1);
        for (let i = 0; i < points; i++) {
          const x = i * slice;
          const noise = Math.sin(i * 0.8 + t * 0.05) * 8;
          const y = h - (i / points) * (h * 0.6) - 20 + noise;

          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      /* ---------- Stage 04 : regulatory domain radar matrix ---------- */
      function drawStage4(view, t) {
        const { ctx, w, h } = view;
        const cx = w / 2;
        const cy = h / 2;

        ctx.strokeStyle = "rgba(255, 69, 0, 0.15)";
        ctx.lineWidth = 1;
        for (let r = 1; r <= 3; r++) {
          ctx.beginPath();
          ctx.arc(cx, cy, r * 15, 0, Math.PI * 2);
          ctx.stroke();
        }

        const angle = (t * 0.03) % (Math.PI * 2);
        ctx.strokeStyle = "rgba(255, 69, 0, 0.6)";
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(angle) * 45, cy + Math.sin(angle) * 45);
        ctx.stroke();
      }

      /* ---------- Background dot-matrix canvas ---------- */
      function initBgCanvas() {
        const canvas = document.getElementById("wj-bg-canvas");
        if (!canvas) return null;
        const ctx = canvas.getContext("2d");

        let w = 0;
        let h = 0;
        let dpr = 1;

        function resize() {
          const rect = canvas.parentElement.getBoundingClientRect();
          w = rect.width;
          h = rect.height;
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.round(w * dpr);
          canvas.height = Math.round(h * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        resize();

        /* Keep the backing store in sync with layout changes. */
        if ("ResizeObserver" in window) {
          const ro = new ResizeObserver(() => resize());
          ro.observe(canvas.parentElement);
        } else {
          window.addEventListener("resize", resize, { passive: true });
        }

        return {
          ctx,
          get w() { return w; },
          get h() { return h; },
        };
      }

      /* =========================================================
         RENDER LOOP
         ========================================================= */
      const DRAWERS = [drawStage1, drawStage2, drawStage3, drawStage4];
      const canvases = DRAWERS.map((_, i) => document.getElementById(`wj-canvas-${i + 1}`));

      let bg = null;
      let rafId = null;
      let running = true;
      let visible = true;
      let frame = 0;

      function renderFrame() {
        frame++;

        // Stage visualizers
        for (let i = 0; i < canvases.length; i++) {
          const view = prepare(canvases[i]);
          if (view) DRAWERS[i](view, frame);
        }

        // Background matrix
        if (bg && bg.w && bg.h) {
          const { ctx, w, h } = bg;
          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = "rgba(255, 69, 0, 0.03)";

          const spacing = 35;
          for (let x = 0; x < w; x += spacing) {
            for (let y = 0; y < h; y += spacing) {
              if ((x + y + Math.floor(frame / 3)) % 100 === 0) {
                ctx.beginPath();
                ctx.arc(x, y, 1.2, 0, Math.PI * 2);
                ctx.fill();
              }
            }
          }
        }
      }

      function render() {
        if (!running) return;
        rafId = requestAnimationFrame(render);
        renderFrame();
      }

      function startLoop() {
        // Never animate while the section is off-screen or when the user has
        // asked for reduced motion.
        if (rafId || !visible || reducedMotion) return;
        running = true;
        rafId = requestAnimationFrame(render);
      }

      function stopLoop() {
        running = false;
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
      }

      /* Pause the loop while the section is off-screen to save CPU. */
      function syncVisibility() {
        const rect = root.getBoundingClientRect();
        const onScreen = rect.bottom > 0 && rect.top < window.innerHeight;
        if (onScreen === visible) return;
        visible = onScreen;
        if (visible) startLoop();
        else stopLoop();
      }

      /* =========================================================
         BOOT
         ========================================================= */
      function init() {
        bg = initBgCanvas();
        initObserver();
        updateProgress();
        syncVisibility();

        window.addEventListener("scroll", () => {
          updateProgress();
          syncVisibility();
        }, { passive: true });

        window.addEventListener("resize", () => {
          updateProgress();
          syncVisibility();
        }, { passive: true });

        if (reducedMotion) {
          // Draw a single static frame and keep it in sync with the scroll.
          updateProgress();
          renderFrame();
          stopLoop();
        } else {
          startLoop();
        }

        if (window.lucide && typeof window.lucide.createIcons === "function") {
          window.lucide.createIcons();
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
    })();
  </script>

  <script>
    (() => {
      const counters = document.querySelectorAll(".jd-count");
      const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

      function animateCounter(element) {
        if (element.dataset.animated === "true") return;
        element.dataset.animated = "true";

        const target = Number(element.dataset.target);
        if (!Number.isFinite(target)) return;

        if (reducedMotion) {
          element.textContent = target.toLocaleString("en-US");
          return;
        }

        const duration = 1800;
        const startTime = performance.now();

        function frame(now) {
          const progress = Math.min((now - startTime) / duration, 1);
          const eased = 1 - Math.pow(1 - progress, 3);
          const current = Math.round(target * eased);
          element.textContent = current.toLocaleString("en-US");

          if (progress < 1) {
            requestAnimationFrame(frame);
          } else {
            element.textContent = target.toLocaleString("en-US");
          }
        }

        requestAnimationFrame(frame);
      }

      if ("IntersectionObserver" in window) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            if (entry.isIntersecting) {
              const counter = entry.target.querySelector(".jd-count");
              if (counter) animateCounter(counter);
              observer.unobserve(entry.target);
            }
          });
        }, {
          threshold: 0.35
        });

        document.querySelectorAll(".jd-stat").forEach((card) => {
          observer.observe(card);
        });
      } else {
        counters.forEach(animateCounter);
      }
    })();
  </script>

  <script>
    const slides = [
      {
        tag: "AGENTIC ENGINE",
        headline: "Deploy Autonomous AI Agents Across Enterprise Workflows.",
        description: "Transform legacy operational overhead into self-governing, multi-agent AI ecosystems that reason, execute, and adapt in real time.",
        video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
        poster: "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1920&q=80"
      },
      {
        tag: "ENTERPRISE ERP MESH",
        headline: "Unify Global Supply Chains & Financial Ecosystems.",
        description: "Seamlessly bridge legacy SAP, Oracle, and enterprise databases with real-time AI-driven data intelligence and zero-downtime integration.",
        video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
        poster: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1920&q=80"
      },
      {
        tag: "CLOUD & DIGITAL VELOCITY",
        headline: "Engineer Resilient Cloud Architecture & Modern Apps.",
        description: "Accelerate digital transformation with high-speed microservices, devops automation, and enterprise-grade cybersecurity standards.",
        video: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4",
        poster: "https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=1920&q=80"
      }
    ];

    let currentSlide = 0;
    let activeVideoSlot = 'a';
    let isPlaying = true;
    let isMuted = true;
    let slideTimeout = null;
    const DURATION = 7000;

    // Background preloader for seamless stream playback
    function preloadAssets() {
      slides.forEach(slide => {
        const v = document.createElement('video');
        v.src = slide.video;
        v.preload = 'metadata';
      });
    }

    function loadAndCrossfadeVideo(newSrc, newPoster) {
      const currentVid = document.getElementById(`video-${activeVideoSlot}`);
      activeVideoSlot = activeVideoSlot === 'a' ? 'b' : 'a';
      const nextVid = document.getElementById(`video-${activeVideoSlot}`);

      nextVid.poster = newPoster;
      nextVid.src = newSrc;
      nextVid.muted = isMuted;

      const playPromise = nextVid.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          nextVid.classList.remove('opacity-0');
          nextVid.classList.add('opacity-100');
          currentVid.classList.remove('opacity-100');
          currentVid.classList.add('opacity-0');
        }).catch(err => {
          // Fallback if browser blocks unmuted play on dynamic slide switch
          if (!isMuted) {
            nextVid.muted = true;
            nextVid.play();
          }
        });
      }
    }

    function switchSlide(index) {
      clearTimeout(slideTimeout);
      currentSlide = index;

      [0, 1, 2].forEach(i => {
        const pBar = document.getElementById(`progress-${i}`);
        const cardEl = document.getElementById(`card-${i}`);
        const numEl = document.getElementById(`num-${i}`);

        if (pBar) {
          pBar.style.transition = 'none';
          pBar.style.width = '0%';
        }

        if (i === index) {
          cardEl.className = "snap-start text-left min-w-[280px] sm:min-w-0 flex-1 cursor-pointer p-5 lg:p-6 transition-all duration-300 relative group glass-card-active border-t-2 border-[#FF5500] focus:outline-none";
          cardEl.setAttribute('aria-selected', 'true');
          if (numEl) numEl.className = "text-xs font-mono font-bold text-[#FF5500]";
        } else {
          cardEl.className = "snap-start text-left min-w-[280px] sm:min-w-0 flex-1 cursor-pointer p-5 lg:p-6 transition-all duration-300 relative group glass-card opacity-70 hover:opacity-100 focus:outline-none";
          cardEl.setAttribute('aria-selected', 'false');
          if (numEl) numEl.className = "text-xs font-mono font-bold text-slate-400";
        }
      });

      document.getElementById('hero-tag').innerText = slides[index].tag;
      document.getElementById('hero-headline').innerText = slides[index].headline;
      document.getElementById('hero-description').innerText = slides[index].description;

      loadAndCrossfadeVideo(slides[index].video, slides[index].poster);

      requestAnimationFrame(() => {
        const activeBar = document.getElementById(`progress-${index}`);
        if (activeBar && isPlaying) {
          activeBar.style.transition = `width ${DURATION}ms linear`;
          activeBar.style.width = '100%';
        }
      });

      if (isPlaying) {
        slideTimeout = setTimeout(() => {
          switchSlide((currentSlide + 1) % slides.length);
        }, DURATION);
      }
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      const playIcon = document.getElementById('icon-play');
      const pauseIcon = document.getElementById('icon-pause');
      const btn = document.getElementById('btn-play-pause');
      const currentVid = document.getElementById(`video-${activeVideoSlot}`);

      if (isPlaying) {
        currentVid.play();
        playIcon.classList.add('hidden');
        pauseIcon.classList.remove('hidden');
        btn.setAttribute('aria-label', 'Pause background video');
        switchSlide(currentSlide);
      } else {
        currentVid.pause();
        clearTimeout(slideTimeout);
        playIcon.classList.remove('hidden');
        pauseIcon.classList.add('hidden');
        btn.setAttribute('aria-label', 'Play background video');
        
        const activeBar = document.getElementById(`progress-${currentSlide}`);
        if (activeBar) {
          const computedWidth = getComputedStyle(activeBar).width;
          activeBar.style.transition = 'none';
          activeBar.style.width = computedWidth;
        }
      }
    }

    function toggleMute() {
      isMuted = !isMuted;
      document.getElementById('video-a').muted = isMuted;
      document.getElementById('video-b').muted = isMuted;

      const mutedIcon = document.getElementById('icon-muted');
      const unmutedIcon = document.getElementById('icon-unmuted');

      if (isMuted) {
        mutedIcon.classList.remove('hidden');
        unmutedIcon.classList.add('hidden');
        btn.setAttribute('aria-label', 'Unmute audio');
      } else {
        mutedIcon.classList.add('hidden');
        unmutedIcon.classList.remove('hidden');
        btn.setAttribute('aria-label', 'Mute audio');
      }
    }

    function toggleModal(show) {

    // Handle background tab visibility throttling to prevent bar drift

      if (document.hidden) {

      } else if (isPlaying) {
        switchSlide(currentSlide);

      function playFx(type) {
        if (!soundOn || !audioCtx) return;
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          const now = audioCtx.currentTime;

          if (type === "switch") {
            osc.type = "triangle";
            osc.frequency.setValueAtTime(440, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.05);
            gain.gain.setValueAtTime(0.03, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.start(now);
            osc.stop(now + 0.05);
          } else {
            osc.type = "square";
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(150, now + 0.03);
            gain.gain.setValueAtTime(0.02, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);

      /* ---------- Matrix backdrop (scoped to this section) ---------- */

      let drops = [];
      const GLYPHS = "0101010101_<>//{}[]ERP_AI_MESH_JURYSOFT";

      function resizeBg() {
        if (!bgCanvas) return;
        const rect = bgCanvas.getBoundingClientRect();
        bgW = bgCanvas.width = Math.max(1, Math.round(rect.width));
        bgH = bgCanvas.height = Math.max(1, Math.round(rect.height));
        const cols = Math.max(1, Math.floor(bgW / 20));
        drops = new Array(cols);
        for (let i = 0; i < cols; i++) drops[i] = Math.random() * -50;
      }

      function drawBg() {
        if (bgCtx) {
          if (matrixOn) {
            bgCtx.fillStyle = "rgba(5, 7, 10, 0.2)";
            bgCtx.fillRect(0, 0, bgW, bgH);
            bgCtx.font = "10px 'JetBrains Mono', monospace";

            for (let i = 0; i < drops.length; i++) {
              const ch = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
              const x = i * 20;
              const y = drops[i] * 20;

              if (i % 5 === 0) bgCtx.fillStyle = "#00FF66";
              else if (i % 7 === 0) bgCtx.fillStyle = "#FF4500";
              else bgCtx.fillStyle = "#1A2336";

              bgCtx.fillText(ch, x, y);

              if (y > bgH && Math.random() > 0.975) drops[i] = 0;
              drops[i]++;
            }
          }
        }
        requestAnimationFrame(drawBg);
      }

      /* ---------- Live visualizer ---------- */
      const vCanvas = document.getElementById("cap-visualizer");
      const vCtx = vCanvas ? vCanvas.getContext("2d") : null;
      let vW = 0, vH = 0;

      function resizeVisualizer() {
        if (!vCanvas || !vCanvas.parentElement) return;
        const rect = vCanvas.parentElement.getBoundingClientRect();
        vW = vCanvas.width = Math.max(1, Math.round(rect.width));
        vH = vCanvas.height = Math.max(1, Math.round(rect.height));
      }

      function drawVisualizer() {
        if (!vCtx) { requestAnimationFrame(drawVisualizer); return; }
        step++;
        vCtx.clearRect(0, 0, vW, vH);

        if (currentKey === "erp") {
          const nodes = [
            { x: vW * 0.2, y: vH * 0.35, label: "SAP ERP" },
            { x: vW * 0.5, y: vH * 0.25, label: "API MESH" },
            { x: vW * 0.8, y: vH * 0.45, label: "ORACLE" },
            { x: vW * 0.35, y: vH * 0.75, label: "CLOUD" },

          ];

          vCtx.lineWidth = 1;
          vCtx.strokeStyle = "rgba(245, 158, 11, 0.25)";
          for (let i = 0; i < nodes.length; i++) {
            for (let j = i + 1; j < nodes.length; j++) {
              vCtx.beginPath();
              vCtx.moveTo(nodes[i].x, nodes[i].y);
              vCtx.lineTo(nodes[j].x, nodes[j].y);
              vCtx.stroke();
            }
          }

          const t = (step % 90) / 90;
          const p1 = nodes[0], p2 = nodes[1];
          vCtx.fillStyle = "#F59E0B";
          vCtx.beginPath();
          vCtx.arc(p1.x + (p2.x - p1.x) * t, p1.y + (p2.y - p1.y) * t, 4, 0, Math.PI * 2);
          vCtx.fill();

          vCtx.font = "8px 'JetBrains Mono', monospace";
          nodes.forEach((n) => {
            vCtx.fillStyle = "#0E131F";
            vCtx.strokeStyle = "#F59E0B";
            vCtx.lineWidth = 2;
            vCtx.beginPath();
            vCtx.arc(n.x, n.y, 8, 0, Math.PI * 2);
            vCtx.fill();
            vCtx.stroke();
            vCtx.fillStyle = "#94A3B8";
            vCtx.fillText(n.label, n.x - 18, n.y + 18);
          });
        } else if (currentKey === "ai") {
          const cx = vW / 2, cy = vH / 2;
          const maxR = Math.min(vW, vH) * 0.38;

          vCtx.strokeStyle = "rgba(168, 85, 247, 0.2)";
          vCtx.lineWidth = 1;
          for (let r = 1; r <= 3; r++) {
            vCtx.beginPath();
            vCtx.arc(cx, cy, (maxR / 3) * r, 0, Math.PI * 2);
            vCtx.stroke();
          }

          const angle = (step * 0.035) % (Math.PI * 2);
          vCtx.strokeStyle = "rgba(168, 85, 247, 0.6)";
          vCtx.beginPath();
          vCtx.moveTo(cx, cy);
          vCtx.lineTo(cx + Math.cos(angle) * maxR, cy + Math.sin(angle) * maxR);
          vCtx.stroke();

          const agents = [
            { r: maxR * 0.45, a: 0.9 },
            { r: maxR * 0.75, a: 2.4 },
            { r: maxR * 0.85, a: 4.8 }
          ];
          vCtx.font = "8px 'JetBrains Mono', monospace";
          agents.forEach((ag, idx) => {
            const ax = cx + Math.cos(ag.a + step * 0.01) * ag.r;
            const ay = cy + Math.sin(ag.a + step * 0.01) * ag.r;
            vCtx.fillStyle = "#A855F7";
            vCtx.beginPath();
            vCtx.arc(ax, ay, 4, 0, Math.PI * 2);
            vCtx.fill();
            vCtx.fillText(`AGENT_0${idx + 1}`, ax + 6, ay + 3);
          });
        } else {
          vCtx.strokeStyle = "#10B981";
          vCtx.lineWidth = 2.5;
          vCtx.beginPath();
          const points = 10;
          const slice = vW / (points - 1);
          for (let i = 0; i < points; i++) {
            const x = i * slice;
            const noise = Math.sin(i * 0.7 + step * 0.05) * 12;
            const y = vH - 0.75 * (i / points) * (vH * 0.5) - 20 + noise;
            if (i === 0) vCtx.moveTo(x, y);
            else vCtx.lineTo(x, y);
          }
          vCtx.stroke();

          vCtx.lineTo(vW, vH);
          vCtx.lineTo(0, vH);
          vCtx.closePath();
          const grad = vCtx.createLinearGradient(0, 0, 0, vH);
          grad.addColorStop(0, "rgba(16, 185, 129, 0.25)");
          grad.addColorStop(1, "rgba(16, 185, 129, 0)");
          vCtx.fillStyle = grad;
          vCtx.fill();
        }

        requestAnimationFrame(drawVisualizer);
      }

      /* ---------- Render ---------- */
      function renderContent() {
        const d = DATA[currentKey];

        $("#cap-title").innerText = d.title;

          </div>
        `).join("");

        refreshIcons();
      }

      function updateBladeState() {
        KEYS.forEach((key) => {
          const blade = $(`[data-cap-blade="${key}"]`);
          const line = $(`[data-cap-line="${key}"]`);
          const tag = $(`[data-cap-tag="${key}"]`);

          const d = DATA[key];
          const active = key === currentKey;

          if (!blade) return;
          blade.classList.toggle("opacity-70", !active);

          if (tag) tag.style.color = active ? d.themeColor : "#64748B";
          if (title) title.style.color = active ? d.themeColor : "#FFFFFF";

      function selectPillar(key) {
        if (!DATA[key] || key === currentKey) return;
        playFx("switch");

        const panel = $("#cap-active-panel");
        panel.classList.remove("cap-panel-visible");
        panel.classList.add("cap-panel-hidden");

        window.setTimeout(() => {
          currentKey = key;
          updateBladeState();
          renderContent();
          panel.classList.remove("cap-panel-hidden");
          panel.classList.add("cap-panel-visible");

      /* ---------- Toast ---------- */
      function showToast(msg) {
        const toast = $doc("#cap-toast");
        const msgEl = $doc("#cap-toast-msg");
        if (!toast || !msgEl) return;

        msgEl.innerText = msg;
        toast.classList.remove("translate-y-20", "opacity-0");
        toast.classList.add("translate-y-0", "opacity-100");

        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => {
          toast.classList.remove("translate-y-0", "opacity-100");
          toast.classList.add("translate-y-20", "opacity-0");
        }, 3000);
      }

      /* ---------- Toggles ---------- */
      function toggleSound() {
        initAudio();
        soundOn = !soundOn;
        const dot = $("#cap-sound-dot");
        const icon = $("#cap-sound-icon");

        if (soundOn) {
          dot.classList.remove("hidden");
          icon.setAttribute("data-lucide", "volume-2");
          showToast("UI Audio Feedback: ACTIVE");
          playFx("switch");
        } else {
          dot.classList.add("hidden");
          icon.setAttribute("data-lucide", "volume-x");
          showToast("UI Audio Feedback: MUTED");
        }
        refreshIcons();
      }

      function toggleMatrix() {
        matrixOn = !matrixOn;
        const icon = $("#cap-anim-icon");
        icon.setAttribute("data-lucide", matrixOn ? "pause" : "play");
        showToast(matrixOn ? "Matrix Stream: RESUMED" : "Matrix Stream: PAUSED");
        refreshIcons();
        playFx("click");
      }

      function handleCta() {
        playFx("click");
        showToast(`Navigating to ${DATA[currentKey].label} Module...`);
        if (typeof window.toggleModal === "function") window.toggleModal(true);
      }

      /* ---------- Lucide icon refresh ---------- */
      function refreshIcons() {
        if (window.lucide && typeof window.lucide.createIcons === "function") {
          window.lucide.createIcons();
        }
      }

      /* ---------- Event wiring (delegated, namespaced) ---------- */
      root.addEventListener("click", (e) => {
        const blade = e.target.closest("[data-cap-blade]");
        if (blade) {
          selectPillar(blade.getAttribute("data-cap-blade"));
          return;
        }
        if (e.target.closest("[data-cap-anim]")) {
          toggleMatrix();
          return;
        }
        if (e.target.closest("[data-cap-sound]")) {
          toggleSound();
          return;
        }
        if (e.target.closest("[data-cap-cta]")) {
          handleCta();
        }
      });

      let resizeRaf = null;
      window.addEventListener("resize", () => {
        if (resizeRaf) window.cancelAnimationFrame(resizeRaf);
        resizeRaf = window.requestAnimationFrame(() => {
          resizeBg();
          resizeVisualizer();
        });
      });

      /* ---------- Boot ---------- */
      function init() {
        resizeBg();
        resizeVisualizer();
        drawBg();
        drawVisualizer();
        updateBladeState();
        renderContent();
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
    })();

        // Telemetry coordinates follow the focused hub (impact chapter keeps HQ coords)
        const hub = meta.hub ? HUBS[meta.hub] : HUBS.bengaluru;
        if (els.coords) els.coords.textContent = hub.coords;

        // Hub buttons
        $$("[data-ww-hub]").forEach((btn) => {
          const hubId = Number(btn.getAttribute("data-ww-hub"));
          btn.classList.toggle("is-active", hubIdToChapter(hubId) === id);
        });

        // Revenue counter (chapter 03)
        if (id === 3 && els.revenue) animateRevenue(els.revenue);

        // Reduced motion: keep the static map in sync with the active chapter
        if (reducedMotion) drawStaticFrame();

        if (opts.scroll) {
          // Claim the target so the scroll observer does not fight the smooth scroll.
          manualTarget = id;
          scrollToChapter(id);
          // Safety net: if the target never reports as intersecting (e.g. it was
          // already on screen) release the claim so scrolling keeps working.
          clearTimeout(manualTargetTimer);
          manualTargetTimer = setTimeout(() => { manualTarget = null; }, 1600);
        }
      }

      function scrollToChapter(id) {
        const target = document.getElementById(`ww-chapter-${id}`);
        if (!target) return;
        const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        target.scrollIntoView({ behavior: reduced ? "auto" : "smooth", block: "center" });
      }

      /* ---------- Revenue count-up ---------- */
      function animateRevenue(el) {
        if (el.dataset.animated === "true") return;
        el.dataset.animated = "true";

        const target = 50;
        if (reducedMotion) {
          el.textContent = String(target);
          return;
        }

        const duration = 1200;
        const start = performance.now();

        function frame(now) {
          const p = Math.min((now - start) / duration, 1);
          const eased = 1 - Math.pow(1 - p, 3);
          el.textContent = String(Math.round(target * eased));
          if (p < 1) requestAnimationFrame(frame);
          else el.textContent = String(target);
        }
        requestAnimationFrame(frame);
      }

      /* =========================================================
         MAP CANVAS ENGINE
         ========================================================= */
      const canvas = $("#ww-map-canvas");
      const ctx = canvas ? canvas.getContext("2d") : null;

      let dpr = 1;
      let frameCount = 0;
      let lastFpsTime = performance.now();
      let rafId = null;
      let running = true;

      /* Normalised (0..1) coordinates for the tactical projection.
         Bengaluru sits inland in south India, Chennai on the SE coast,
         Dubai sits on the Gulf coast to the east. */
      const NODE_POS = {
        bengaluru: { x: 0.30, y: 0.66 },
        chennai:   { x: 0.44, y: 0.74 },
        dubai:     { x: 0.72, y: 0.46 }
      };

      /* Stylised wireframe coastlines */
      const LAND_INDIA = [
        [0.22, 0.34], [0.34, 0.38], [0.42, 0.44], [0.48, 0.52], [0.46, 0.62],
        [0.44, 0.74], [0.38, 0.86], [0.30, 0.80], [0.28, 0.72], [0.30, 0.66],
        [0.22, 0.60], [0.16, 0.50], [0.12, 0.42], [0.18, 0.36]
      ];

      const LAND_ARABIA = [
        [0.56, 0.40], [0.64, 0.42], [0.72, 0.46], [0.76, 0.56], [0.70, 0.66],
        [0.62, 0.64], [0.56, 0.54], [0.52, 0.42]
      ];

      function resizeCanvas() {
        if (!canvas || !canvas.parentElement) return;
        const rect = canvas.parentElement.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        // setTransform (not scale) so repeated resizes never accumulate transforms
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function toPixel(nx, ny, w, h) {
        return { x: nx * w, y: ny * h };
      }

      /* ---------- Grid + landmass ---------- */
      function drawGrid(w, h) {
        ctx.strokeStyle = "rgba(22, 70, 160, 0.28)";
        ctx.lineWidth = 1;
        const step = 28;
        ctx.beginPath();
        for (let x = 0; x <= w; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
        for (let y = 0; y <= h; y += step) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
        ctx.stroke();

        // Crosshair axes
        ctx.strokeStyle = "rgba(255, 255, 255, 0.07)";
        ctx.beginPath();
        ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h);
        ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2);
        ctx.stroke();
      }

      function drawLand(points, w, h, color) {
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.25;
        ctx.setLineDash([3, 4]);
        ctx.beginPath();
        points.forEach((p, i) => {
          const px = toPixel(p[0], p[1], w, h);
          if (i === 0) ctx.moveTo(px.x, px.y);
          else ctx.lineTo(px.x, px.y);
        });
        ctx.closePath();
        ctx.stroke();
        ctx.restore();
      }

      /* ---------- Node beacon ---------- */
      function drawBeacon(px, py, color, label, isFocused, t) {
        // Radar ripple
        const cycle = (t % 2600) / 2600;
        const radius = 4 + cycle * 26;
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - cycle);
        ctx.strokeStyle = color;
        ctx.lineWidth = isFocused ? 2 : 1;
        ctx.beginPath();
        ctx.arc(px, py, radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        // Static focus ring
        if (isFocused) {
          ctx.save();
          ctx.strokeStyle = color;
          ctx.globalAlpha = 0.55;
          ctx.lineWidth = 1;
          ctx.setLineDash([2, 3]);
          ctx.beginPath();
          ctx.arc(px, py, 13, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        // Core
        ctx.save();
        ctx.fillStyle = color;
        ctx.shadowBlur = isFocused ? 16 : 8;
        ctx.shadowColor = color;
        ctx.beginPath();
        ctx.arc(px, py, isFocused ? 5.5 : 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Label
        ctx.fillStyle = isFocused ? "#FFFFFF" : "rgba(255,255,255,0.55)";
        ctx.font = `${isFocused ? "bold " : ""}10px "JetBrains Mono", monospace`;
        ctx.fillText(label, px + 11, py + 3.5);
      }

      /* ---------- Link beam with travelling particle ---------- */
      function drawBeam(a, b, color, t, strength) {
        const midX = (a.x + b.x) / 2;
        const midY = (a.y + b.y) / 2 - 26;

        ctx.save();
        ctx.strokeStyle = color;
        ctx.globalAlpha = 0.45 * strength;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.quadraticCurveTo(midX, midY, b.x, b.y);
        ctx.stroke();
        ctx.restore();

        // Travelling energy packet
        const p = (t % 2600) / 2600;
        const px = (1 - p) * (1 - p) * a.x + 2 * (1 - p) * p * midX + p * p * b.x;
        const py = (1 - p) * (1 - p) * a.y + 2 * (1 - p) * p * midY + p * p * b.y;

        ctx.save();
        ctx.fillStyle = "#FFFFFF";
        ctx.shadowBlur = 10;
        ctx.shadowColor = color;
        ctx.beginPath();
        ctx.arc(px, py, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      /* ---------- Engineer swarm (chapter 02+) ---------- */
      function drawSwarm(cx, cy, t, color) {
        const count = 8;
        ctx.save();
        ctx.fillStyle = color;
        for (let i = 0; i < count; i++) {
          const angle = t * 0.0006 + (i * (Math.PI * 2 / count));
          const dist = 20 + Math.sin(t * 0.0009 + i) * 6;
          ctx.globalAlpha = 0.75;
          ctx.beginPath();
          ctx.arc(cx + Math.cos(angle) * dist, cy + Math.sin(angle) * dist, 1.8, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      /* ---------- Revenue ring (chapter 03) ---------- */
      function drawRevenueRing(px, py, t, color) {
        const pulse = (Math.sin(t * 0.0015) + 1) / 2;
        ctx.save();
        ctx.strokeStyle = color;
        ctx.globalAlpha = 0.5 + pulse * 0.35;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(px, py, 34 + pulse * 10, 0, Math.PI * 2);
        ctx.stroke();

        ctx.globalAlpha = 0.22;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(px, py, 34 + pulse * 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      /* =========================================================
         RENDER LOOP
         ========================================================= */
      function render(now) {
        if (!running) return;
        rafId = requestAnimationFrame(render);

        frameCount++;

        // FPS readout (own counter — not shared with other sections)
        if (now - lastFpsTime >= 1000) {
          const fps = Math.round((frameCount * 1000) / (now - lastFpsTime));
          if (els.fps) els.fps.textContent = `FPS: ${fps}`;
          lastFpsTime = now;
          frameCount = 0;
        }

        const w = canvas.width / dpr;
        const h = canvas.height / dpr;
        ctx.clearRect(0, 0, w, h);

        drawGrid(w, h);
        drawLand(LAND_INDIA, w, h, "rgba(22, 70, 160, 0.55)");
        drawLand(LAND_ARABIA, w, h, "rgba(22, 70, 160, 0.45)");

        const bengaluru = toPixel(NODE_POS.bengaluru.x, NODE_POS.bengaluru.y, w, h);
        const chennai = toPixel(NODE_POS.chennai.x, NODE_POS.chennai.y, w, h);
        const dubai = toPixel(NODE_POS.dubai.x, NODE_POS.dubai.y, w, h);

        const c = activeChapter;

        // Chapter 02+ : Bengaluru -> Chennai link + senior engineer swarm
        if (c >= 2) {
          drawBeam(bengaluru, chennai, "#FF8A3D", now, 1);
          drawSwarm(bengaluru.x, bengaluru.y, now, "#FF8A3D");
        }

        // Chapter 03+ : revenue impact ring
        if (c >= 3) {
          drawBeam(chennai, dubai, "#FFFFFF", now, 0.7);
          drawRevenueRing(bengaluru.x, bengaluru.y, now, "#FF5500");
        }

        // Chapter 04 : full regional mesh
        if (c >= 4) {
          drawBeam(bengaluru, dubai, "#FF5500", now, 1);

          ctx.save();
          ctx.strokeStyle = "rgba(255, 85, 0, 0.35)";
          ctx.lineWidth = 1.5;
          ctx.setLineDash([6, 6]);
          ctx.beginPath();
          ctx.moveTo(bengaluru.x, bengaluru.y);
          ctx.lineTo(chennai.x, chennai.y);
          ctx.lineTo(dubai.x, dubai.y);
          ctx.closePath();
          ctx.stroke();
          ctx.restore();
        }

        // Beacons (focused hub = white core + bold label)
        const focusMap = { 1: "bengaluru", 2: "chennai", 3: null, 4: "dubai" };
        const focus = focusMap[c];

        drawBeacon(bengaluru.x, bengaluru.y, "#FF5500", "BENGALURU HQ", focus === "bengaluru", now);
        if (c >= 2) drawBeacon(chennai.x, chennai.y, "#FF8A3D", "CHENNAI", focus === "chennai", now);
        if (c >= 3) drawBeacon(dubai.x, dubai.y, "#FFFFFF", "DUBAI HUB", focus === "dubai", now);
      }

      function startLoop() {
        if (rafId) return;
        running = true;
        lastFpsTime = performance.now();
        frameCount = 0;
        rafId = requestAnimationFrame(render);
      }

      function stopLoop() {
        running = false;
        if (rafId) cancelAnimationFrame(rafId);
        rafId = null;
      }

      /* Draw a single static frame (used for reduced motion / paused states) */
      function drawStaticFrame() {
        if (!canvas || !ctx) return;
        const w = canvas.width / dpr;
        const h = canvas.height / dpr;
        ctx.clearRect(0, 0, w, h);
        drawGrid(w, h);
        drawLand(LAND_INDIA, w, h, "rgba(22, 70, 160, 0.55)");
        drawLand(LAND_ARABIA, w, h, "rgba(22, 70, 160, 0.45)");

        const b = toPixel(NODE_POS.bengaluru.x, NODE_POS.bengaluru.y, w, h);
        const c = toPixel(NODE_POS.chennai.x, NODE_POS.chennai.y, w, h);
        const d = toPixel(NODE_POS.dubai.x, NODE_POS.dubai.y, w, h);
        const now = performance.now();

        if (activeChapter >= 2) drawBeam(b, c, "#FF8A3D", now, 1);
        if (activeChapter >= 3) {
          drawBeam(c, d, "#FFFFFF", now, 0.7);
          drawRevenueRing(b.x, b.y, now, "#FF5500");
        }
        if (activeChapter >= 4) drawBeam(b, d, "#FF5500", now, 1);

        const focusMap = { 1: "bengaluru", 2: "chennai", 3: null, 4: "dubai" };
        const focus = focusMap[activeChapter];
        drawBeacon(b.x, b.y, "#FF5500", "BENGALURU HQ", focus === "bengaluru", now);
        if (activeChapter >= 2) drawBeacon(c.x, c.y, "#FF8A3D", "CHENNAI", focus === "chennai", now);
        if (activeChapter >= 3) drawBeacon(d.x, d.y, "#FFFFFF", "DUBAI HUB", focus === "dubai", now);
      }

      /* =========================================================
         SCROLL OBSERVER — activates chapters as they enter view
         ========================================================= */
      /* Vertical centre of the activation band
         (rootMargin -20% / -40%  =>  band spans 20%..60% of the viewport). */
      function bandCentre() {
        return window.innerHeight * 0.4;
      }

      /* The chapter that owns the band: the LAST card whose top edge has already
         scrolled above the band line. Using the top edge (not the midpoint)
         keeps the result monotonic while scrolling, so no chapter is skipped,
         and it degrades gracefully when two cards overlap the band. */
      function computeActiveChapter() {
        const line = bandCentre();
        let best = null;

        $$("[data-ww-chapter]").forEach((card) => {
          const r = card.getBoundingClientRect();
          if (r.top <= line) best = Number(card.getAttribute("data-ww-chapter"));
        });

        // Before the first card reaches the line, keep chapter 1 active.
        return best === null ? 1 : best;
      }

      function initObserver() {
        if (!("IntersectionObserver" in window)) return;

        const observer = new IntersectionObserver(() => {
          // The observer is only a *trigger* — the authoritative chapter is
          // always derived from the current scroll geometry, because a fast
          // flick can carry a card clean through the band between two observer
          // batches (that card would otherwise never be reported).
          syncActiveFromScroll();
        }, {
          root: null,
          rootMargin: "-20% 0px -40% 0px",
          threshold: 0
        });

        $$("[data-ww-chapter]").forEach((card) => observer.observe(card));
      }

      /* Single source of truth for the active chapter. Safe to call on every
         scroll frame: it is idempotent and cheap (4 rect reads). */
      function syncActiveFromScroll() {
        if (!sectionVisible) return;

        // A manual jump is in flight: only complete it once the target card has
        // actually arrived at the activation band.
        if (manualTarget !== null) {
          const card = document.getElementById(`ww-chapter-${manualTarget}`);
          if (card) {
            const r = card.getBoundingClientRect();
            const mid = r.top + r.height / 2;
            if (Math.abs(mid - bandCentre()) <= window.innerHeight * 0.35) {
              const id = manualTarget;
              manualTarget = null;
              clearTimeout(manualTargetTimer);
              manualTargetTimer = null;
              if (id !== activeChapter) activateChapter(id);
            }
          }
          return;
        }

        const best = computeActiveChapter();
        if (best && best !== activeChapter) activateChapter(best);
      }

      /* rAF-throttled scroll driver — guarantees the active chapter always
         matches the scroll position, no matter how fast the user scrolls. */
      let scrollRaf = null;
      function onScroll() {
        if (scrollRaf) return;
        scrollRaf = window.requestAnimationFrame(() => {
          scrollRaf = null;
          syncActiveFromScroll();
        });
      }

      /* Snap to whichever chapter owns the band. Used on scroll-end so the last
         chapter still activates even when the page cannot scroll further. */
      function activateNearestChapter() {
        const best = computeActiveChapter();
        if (best && best !== activeChapter) activateChapter(best);
      }

      /* =========================================================
         EVENT WIRING (delegated, namespaced)
         ========================================================= */
      function hubIdToChapter(hubId) {
        const key = Object.keys(HUBS).find((k) => HUBS[k].id === hubId);
        return key ? HUBS[key].chapter : null;
      }

      root.addEventListener("click", (e) => {
        const hubBtn = e.target.closest("[data-ww-hub]");
        if (hubBtn) {
          const chapter = hubIdToChapter(Number(hubBtn.getAttribute("data-ww-hub")));
          if (chapter) activateChapter(chapter, { scroll: true });
          return;
        }

        const goto = e.target.closest("[data-ww-goto]");
        if (goto) {
          const chapter = Number(goto.getAttribute("data-ww-goto"));
          if (chapter) activateChapter(chapter, { scroll: true });
        }
      });

      /* ---------- Resize (debounced via rAF) ---------- */
      let resizeRaf = null;
      window.addEventListener("resize", () => {
        if (resizeRaf) window.cancelAnimationFrame(resizeRaf);
        resizeRaf = window.requestAnimationFrame(() => {
          resizeCanvas();
          if (reducedMotion) drawStaticFrame();
        });
      });

      /* ---------- Pause the loop when the section is off-screen ---------- */
      let sectionVisible = false;
      function syncLoop() {
        if (reducedMotion) {
          stopLoop();
          drawStaticFrame();
          return;
        }
        if (sectionVisible && !document.hidden) startLoop();
        else stopLoop();
      }

      if ("IntersectionObserver" in window) {
        const visibility = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            sectionVisible = entry.isIntersecting;
            syncLoop();
          });
        }, { threshold: 0.02 });
        visibility.observe(root);
      } else {
        sectionVisible = true;
      }

      /* ---------- Visibility change (tab throttling) ---------- */
      document.addEventListener("visibilitychange", syncLoop);

      /* ---------- Scroll driver ----------
         rAF-throttled: the active chapter is recomputed from the live scroll
         geometry on every frame, so no chapter can be skipped no matter how
         fast the user scrolls. */
      let scrollEndTimer = null;
      window.addEventListener("scroll", () => {
        onScroll();

        if (scrollEndTimer) clearTimeout(scrollEndTimer);
        scrollEndTimer = setTimeout(() => {
          if (!sectionVisible) return;
          // Snap when the END OF THIS SECTION is reached — not the end of the
          // document. The Industry Expertise section follows this one, so the
          // page can keep scrolling long after this section is fully shown.
          const secBottom = root.getBoundingClientRect().bottom;
          const atSectionEnd = secBottom <= window.innerHeight + 80;
          if (atSectionEnd) activateNearestChapter();
        }, 180);
      }, { passive: true });

      /* ---------- Boot ---------- */
      function init() {
        resizeCanvas();
        activateChapter(1);
        initObserver();
        syncLoop();

        // Lucide icons inside this section
        if (window.lucide && typeof window.lucide.createIcons === "function") {
          window.lucide.createIcons();
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
      } else {
        init();
      }
    })();
  </script>

  <script>
    (() => {
      "use strict";

      const section = document.getElementById("industry-expertise");
      if (!section) return;

      const grid = section.querySelector(".ie-grid");

      /* ---------- Scroll reveal ---------- */
      const reveal = () => {
        if (!grid) return;
        grid.classList.add("ie-in");
      };

      if ("IntersectionObserver" in window && grid) {
        const io = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                reveal();
                io.disconnect();
              }
            });
          },
          { threshold: 0.12, rootMargin: "0px 0px -8% 0px" }
        );
        io.observe(grid);
      } else {
        reveal();
      }

      /* ---------- Lucide icons ---------- */
      const paintIcons = () => {
        if (window.lucide && typeof window.lucide.createIcons === "function") {
          window.lucide.createIcons();
        }
      };

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", paintIcons);
      } else {
        paintIcons();
      }
    })();
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script>
(function(){
  const root = document.documentElement;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rows = Array.from(document.querySelectorAll('#rows .row'));
  const table = document.getElementById('table');

  /* ---------- cursor spotlight (works even with reduced motion) ---------- */
  table.addEventListener('pointermove', e => {
    const r = table.getBoundingClientRect();
    table.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    table.style.setProperty('--my', (e.clientY - r.top) + 'px');
  });
  table.addEventListener('pointerleave', () => {
    table.style.setProperty('--mx', '50%');
    table.style.setProperty('--my', '-30%');
  });

  if (reduce || !window.gsap || !window.ScrollTrigger) {
    root.classList.add('static');
    rows.forEach(r => r.classList.add('resolved'));
    document.getElementById('eyebrow').classList.add('in');
    return;
  }

  gsap.registerPlugin(ScrollTrigger);

  /* ---------- smooth scroll (Lenis) synced to ScrollTrigger ---------- */
  if (window.Lenis) {
    const lenis = new Lenis({ lerp: 0.09, smoothWheel: true });
    lenis.on('scroll', ScrollTrigger.update);
    gsap.ticker.add(t => lenis.raf(t * 1000));
    gsap.ticker.lagSmoothing(0);
  }

  /* ---------- headline: masked line reveal ---------- */
  gsap.fromTo('#title .mask > span', { yPercent: 112 }, {
    yPercent: 0,
    duration: 1.2, ease: 'expo.out', stagger: 0.12,
    scrollTrigger: { trigger: '#title', start: 'top 82%', once: true,
      onEnter: () => document.getElementById('eyebrow').classList.add('in') }
  });

  /* ---------- headline: strike-through scrubbed by scroll ---------- */
  const strikeTl = gsap.timeline({
    scrollTrigger: { trigger: '#title', start: 'top 38%', end: 'bottom 18%', scrub: 0.6 }
  });
  document.querySelectorAll('#title .x').forEach(x => {
    strikeTl.to(x.querySelector('i'), { scaleX: 1, ease: 'none' })
            .to(x, { opacity: .42, ease: 'none' }, '<');
  });

  /* ---------- lede: word-by-word illumination ---------- */
  (function splitWords(el){
    const walk = node => {
      Array.from(node.childNodes).forEach(n => {
        if (n.nodeType === 3) {
          const frag = document.createDocumentFragment();
          n.textContent.split(/(\s+)/).forEach(tok => {
            if (!tok) return;
            if (/^\s+$/.test(tok)) { frag.appendChild(document.createTextNode(' ')); return; }
            const s = document.createElement('span'); s.className = 'w'; s.textContent = tok; frag.appendChild(s);
          });
          n.replaceWith(frag);
        } else if (n.nodeType === 1) walk(n);
      });
    };
    walk(el);
  })(document.getElementById('lede'));

  gsap.to('#lede .w', {
    opacity: 1, ease: 'none', stagger: 0.08,
    scrollTrigger: { trigger: '#lede', start: 'top 82%', end: 'bottom 48%', scrub: 0.5 }
  });

  /* ---------- positioning map ---------- */
  const mapTl = gsap.timeline({
    scrollTrigger: { trigger: '#map', start: 'top 80%', end: 'top 28%', scrub: 0.7 }
  });
  gsap.set('.pt-a,.pt-b', { opacity: 0, y: 8 });
  gsap.set('.pt-j', { opacity: 0, scale: 0.2 });
  mapTl
    .to('.pt-a', { opacity: 1, y: 0, duration: .5 }, 0)
    .to('.pt-b', { opacity: 1, y: 0, duration: .5 }, 0.1)
    .to('.track i', { scaleX: 1, duration: 1, ease: 'power2.out' }, 0.2)
    .to('.pt-j', { opacity: 1, scale: 1, duration: .8, ease: 'power3.out' }, 0.8)
    .to('.tag', { opacity: 1, duration: .4 }, 1.4);

  /* ---------- table: counters ---------- */
  rows.forEach(r => r.querySelectorAll('[data-count]').forEach(el => {
    el._final = +el.dataset.count; el.textContent = '0';
  }));
  const counted = new WeakSet();
  function runCounters(row){
    if (counted.has(row)) return; counted.add(row);
    row.querySelectorAll('[data-count]').forEach(el => {
      const o = { v: 0 };
      gsap.to(o, { v: el._final, duration: 1.3, ease: 'power3.out',
        onUpdate: () => el.textContent = Math.round(o.v) });
    });
  }

  /* ---------- table: scroll-driven chaos -> order ---------- */
  const N = rows.length;
  const railFill = document.getElementById('railFill');
  const glow = document.getElementById('glow');
  const hint = document.getElementById('hint');

  function applyProgress(p){
    let last = -1;
    rows.forEach((row, i) => {
      const on = p >= 0.05 + i * 0.145;
      row.classList.toggle('resolved', on);
      if (on) { last = i; runCounters(row); }
    });
    rows.forEach((row, i) => row.classList.toggle('active', i === last && p < 0.97));
    gsap.set(railFill, { scaleY: Math.min(1, p / 0.84) });
    gsap.set(glow, { opacity: Math.min(1, p * 1.6) });
    hint.style.opacity = p > 0.9 ? 0 : 1;
  }
  applyProgress(0);

  const mm = gsap.matchMedia();

  // Desktop: pin the table, scroll drives the story
  mm.add('(min-width: 861px)', () => {
    ScrollTrigger.create({
      trigger: '#tableWrap',
      start: 'center center',
      end: '+=1700',
      pin: true,
      anticipatePin: 1,
      onUpdate: self => applyProgress(self.progress),
      onLeaveBack: () => applyProgress(0)
    });
  });

  // Mobile: no pin, rows resolve as you scroll past
  mm.add('(max-width: 860px)', () => {
    ScrollTrigger.create({
      trigger: '#rows',
      start: 'top 70%',
      end: 'bottom 62%',
      onUpdate: self => applyProgress(self.progress),
      onLeaveBack: () => applyProgress(0)
    });
  });

  window.addEventListener('load', () => ScrollTrigger.refresh());
})();
</script>
